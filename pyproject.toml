[project]
name = "silicon-wolf-village"
version = "0.1.0"
description = "12-player AI Werewolf game with dual-model factions, god-view spectator, real-time reasoning, voting & replay analysis on Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.57.0,<1.58.0",
  "openai>=1.10.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
