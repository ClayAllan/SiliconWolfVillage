name: Streamlit deployment smoke

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deployed-build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait for Streamlit Cloud to serve the expected build
        env:
          APP_URL: https://siliconwolfvillage.streamlit.app/
          EXPECTED_MARKER: SWV-20261030-STARLETTE-141-FIX
        run: |
          python - <<'PY'
          import os
          import time
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          marker = f"部署验收标记：{os.environ['EXPECTED_MARKER']}"
          deadline = time.monotonic() + 600
          last_error = "marker not checked yet"
          status = "not available"
          attempt = 0

          def frame_diagnostics(page):
              snapshots = []
              for index, frame in enumerate(page.frames):
                  try:
                      body = " ".join(frame.locator("body").inner_text(timeout=1500).split())
                  except Exception as error:
                      body = f"<body unavailable: {type(error).__name__}: {error}>"
                  snapshots.append({
                      "index": index,
                      "url": frame.url,
                      "body_preview": body[:900],
                  })
              return snapshots

          def find_marker_frame(page, expected_text, timeout_seconds=20):
              marker_deadline = time.monotonic() + timeout_seconds
              while time.monotonic() < marker_deadline:
                  for frame in list(page.frames):
                      try:
                          match = frame.get_by_text(expected_text, exact=True)
                          if match.count() and match.first.is_visible():
                              return frame
                      except Exception:
                          continue
                  time.sleep(1)
              return None

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page()
              while time.monotonic() < deadline:
                  attempt += 1
                  try:
                      response = page.goto(url, wait_until="domcontentloaded", timeout=90000)
                      status = response.status if response else "no HTTP response"
                      marker_frame = find_marker_frame(page, marker, timeout_seconds=20)
                      if marker_frame is None:
                          raise TimeoutError(f"build marker not found in any of {len(page.frames)} frames")
                      print(
                          f"Deployed Streamlit build confirmed: {marker}; HTTP {status}; "
                          f"frame={marker_frame.url}"
                      )
                      browser.close()
                      raise SystemExit(0)
                  except Exception as error:
                      last_error = f"{type(error).__name__}: {error}"
                      snapshots = frame_diagnostics(page)
                      body = " | ".join(item["body_preview"] for item in snapshots)
                      if attempt == 1 or attempt % 3 == 0:
                          print(
                              f"Deployment diagnostic attempt={attempt} HTTP={status} "
                              f"title={page.title()!r} frames={snapshots!r}"
                          )

                      if (
                          "This app has encountered an error" in body
                          or "ImportError:" in body
                          or "Traceback:" in body
                      ):
                          try:
                              page.screenshot(
                                  path="streamlit-deployment-smoke-failure.png", full_page=True
                              )
                          except Exception as screenshot_error:
                              print(f"Could not capture startup-error screenshot: {screenshot_error}")
                          browser.close()
                          raise SystemExit(
                              f"Streamlit returned an app startup error (HTTP {status}): "
                              f"{body[:1600]}"
                          )

                      print(f"Deployment marker not visible yet (attempt {attempt}): {last_error}")
                      time.sleep(20)

              try:
                  page.screenshot(path="streamlit-deployment-smoke-failure.png", full_page=True)
              except Exception as error:
                  print(f"Could not capture failure screenshot: {error}")
              browser.close()
              raise SystemExit(
                  "Streamlit Cloud did not serve the expected build marker within 10 minutes. "
                  f"Last browser error: {last_error}"
              )
          PY

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-deployment-smoke-failure
          path: streamlit-deployment-smoke-failure.png
          if-no-files-found: ignore
