name: Streamlit deployment smoke

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deployed-build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait for Streamlit Cloud to serve the expected build
        env:
          APP_URL: https://siliconwolfvillage.streamlit.app/
          EXPECTED_MARKER: SWV-20261030-RELATIONSHIP-ZIP-CACHE
        run: |
          python - <<'PY'
          import os
          import time
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          marker = f"部署验收标记：{os.environ['EXPECTED_MARKER']}"
          deadline = time.monotonic() + 600
          last_error = "marker not checked yet"
          status = "not available"
          attempt = 0

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page()
              while time.monotonic() < deadline:
                  attempt += 1
                  try:
                      response = page.goto(url, wait_until="domcontentloaded", timeout=90000)
                      status = response.status if response else "no HTTP response"
                      page.get_by_text(marker, exact=True).wait_for(state="visible", timeout=20000)
                      print(f"Deployed Streamlit build confirmed: {marker}; HTTP {status}")
                      browser.close()
                      raise SystemExit(0)
                  except Exception as error:
                      last_error = f"{type(error).__name__}: {error}"
                      if attempt == 1 or attempt % 3 == 0:
                          try:
                              title = page.title()
                              body = " ".join(page.locator("body").inner_text(timeout=3000).split())
                          except Exception as diagnostic_error:
                              title = "unavailable"
                              body = f"Could not read page text: {diagnostic_error}"
                          print(
                              f"Deployment diagnostic attempt={attempt} HTTP={status} "
                              f"title={title!r} body_preview={body[:1600]!r}"
                          )
                      print(f"Deployment marker not visible yet (attempt {attempt}): {last_error}")
                      time.sleep(20)

              try:
                  page.screenshot(path="streamlit-deployment-smoke-failure.png", full_page=True)
              except Exception as error:
                  print(f"Could not capture failure screenshot: {error}")
              browser.close()
              raise SystemExit(
                  "Streamlit Cloud did not serve the expected build marker within 10 minutes. "
                  f"Last browser error: {last_error}"
              )
          PY

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-deployment-smoke-failure
          path: streamlit-deployment-smoke-failure.png
          if-no-files-found: ignore
